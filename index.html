<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#305742" />
    <meta name="description" content="Your personal fitness journal. Everything stays on this device." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Groundwork</title>
    <script>
      try {
        // Light is the default; mirror of getPrefs() in src/lib/prefs.ts so there's no flash of the wrong theme.
        var p = JSON.parse(localStorage.getItem('gw.prefs') || '{}')
        var t = p.theme === 'system' && p.v !== 2 ? 'light' : p.theme || 'light'
        if (t !== 'system') document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
