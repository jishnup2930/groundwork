# Builds and publishes the app to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        # Served at the domain root for a custom domain or a <user>.github.io repo,
        # otherwise under /<repo-name>/.
        run: |
          if [ -f public/CNAME ] || [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            export BASE_PATH=/
          else
            export BASE_PATH=/${{ github.event.repository.name }}/
          fi
          npm run build
          # GitHub Pages has no rewrites: serve the app for unknown paths so refreshing /history works.
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
